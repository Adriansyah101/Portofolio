<!doctype html>
<html lang="en" data-theme="dark" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <script>
      // Apply the saved theme and language before the first paint (no flash).
      // Keys match src/context/ThemeContext.jsx and LanguageContext.jsx.
      (function () {
        var root = document.documentElement;
        var theme = "dark";
        var lang = "en";
        try {
          var storedTheme = localStorage.getItem("portfolio-theme");
          var storedLang = localStorage.getItem("portfolio-lang");
          if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
          if (storedLang === "id" || storedLang === "en") lang = storedLang;
        } catch (error) {}
        root.setAttribute("data-theme", theme);
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        root.lang = lang;
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f8fafc");
        }
      })();
    </script>
    <meta
      name="description"
      content="Adriansyah Prasetya Nugraha (adriansyah101): Systems & Application Operations Engineer from Semarang, Indonesia. Enterprise production operations at PT ASDP Indonesia Ferry (Persero): high-availability ticketing (trip.ferizy.com), hybrid cloud/on-premise port deployments and Omron barrier gate integration, plus low-level binary recompilation."
    />
    <meta property="og:title" content="Adriansyah Prasetya Nugraha | Systems & Application Operations Engineer" />
    <meta
      property="og:description"
      content="Reliable production systems and native software architecture: national ferry ticketing operations, hybrid cloud and harbor server deployments, industrial gate integration and C/C++ static recompilation."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Mona+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Adriansyah Prasetya Nugraha | Systems & Application Operations Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
